<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>G ONE AI — Gemini</title>
<style>
:root{--bg:#070b16;--panel:#0d1322;--panel2:#111a2d;--line:#1d2942;--text:#eef3ff;--muted:#8d9ab5;--accent:#6d7cff;--accent2:#9b6dff;--user:#5b67f1;--ai:#121c30;--good:#39d98a;--shadow:0 24px 70px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(900px 500px at 70% -10%,rgba(109,124,255,.16),transparent 60%),radial-gradient(700px 500px at -10% 80%,rgba(155,109,255,.10),transparent 55%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit}.app{height:100%;max-width:1500px;margin:auto;display:grid;grid-template-columns:250px 1fr;background:rgba(7,11,22,.72)}
.sidebar{border-right:1px solid var(--line);background:rgba(10,15,27,.82);backdrop-filter:blur(20px);padding:18px 14px;display:flex;flex-direction:column;gap:18px}.logo{display:flex;align-items:center;gap:10px;padding:8px 10px}.logo-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6878ff,#a568ff);box-shadow:0 10px 28px rgba(109,124,255,.28);font-size:22px}.logo strong{font-size:20px;letter-spacing:-.5px}.logo small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.newchat{border:1px solid #2c3a5c;background:linear-gradient(135deg,rgba(109,124,255,.18),rgba(155,109,255,.10));color:#fff;border-radius:13px;padding:12px 14px;cursor:pointer;font-weight:700;text-align:left}.side-title{font-size:11px;color:#697792;text-transform:uppercase;letter-spacing:1.2px;padding:0 10px}.quick{display:grid;gap:7px}.quick button{background:transparent;border:1px solid transparent;color:#aeb9cf;text-align:left;padding:10px;border-radius:10px;cursor:pointer}.quick button:hover{background:#121b2d;border-color:#202d49;color:#fff}.side-footer{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px;color:#68758e;font-size:11px;line-height:1.5}
.main{min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px;background:rgba(10,15,27,.70);backdrop-filter:blur(18px)}.mobile-menu{display:none}.top-title{display:flex;align-items:center;gap:10px}.top-title h1{font-size:16px;margin:0}.badge{font-size:10px;font-weight:800;letter-spacing:.7px;padding:6px 9px;border-radius:999px;background:rgba(57,217,138,.12);color:var(--good);border:1px solid rgba(57,217,138,.25)}.status{margin-left:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px}.status-dot{width:7px;height:7px;border-radius:50%;background:#66738e}.tools{display:flex;gap:6px;margin-left:10px}.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;color:#aab6ce;cursor:pointer}.icon-btn:hover{background:#131d31;border-color:#24314c;color:#fff}
.chat-wrap{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}.chat{width:min(900px,calc(100% - 40px));margin:0 auto;padding:38px 0 150px}.welcome{text-align:center;padding:30px 15px 42px}.welcome-icon{width:70px;height:70px;margin:0 auto 18px;border-radius:23px;display:grid;place-items:center;background:linear-gradient(135deg,#6878ff,#a568ff);font-size:36px;box-shadow:0 18px 45px rgba(109,124,255,.22)}.welcome h2{margin:0 0 8px;font-size:30px;letter-spacing:-1px}.welcome p{margin:0;color:var(--muted);font-size:14px}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:620px;margin:24px auto 0}.suggestions button{border:1px solid var(--line);background:rgba(17,26,45,.7);color:#bdc8dc;border-radius:13px;padding:12px;text-align:left;cursor:pointer}.suggestions button:hover{border-color:#34466d;background:#14203a;color:#fff}.msg-row{display:flex;gap:11px;margin:18px 0;align-items:flex-start}.msg-row.user-row{justify-content:flex-end}.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;background:#18233a;color:#aab6ff;font-size:15px}.user-row .avatar{order:2;background:linear-gradient(135deg,#5b67f1,#805cf2);color:#fff}.msg{max-width:min(78%,720px);padding:13px 16px;border-radius:17px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.ai{background:linear-gradient(180deg,#121c30,#10192b);border:1px solid #1f2c47;color:#e8eefb;border-top-left-radius:5px}.user{background:linear-gradient(135deg,#5968ef,#735be8);color:white;border-top-right-radius:5px;box-shadow:0 10px 25px rgba(78,89,210,.18)}.typing{display:flex;gap:5px;padding:3px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:#7887a5;animation:b 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer-area{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 22px;background:linear-gradient(transparent,rgba(7,11,22,.94) 35%)}.composer{width:min(900px,100%);margin:auto}.input-box{display:flex;align-items:center;gap:8px;padding:8px 9px 8px 13px;background:rgba(16,24,42,.96);border:1px solid #2a3857;border-radius:17px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.input-box:focus-within{border-color:#5365d9;box-shadow:0 0 0 3px rgba(83,101,217,.12),0 18px 50px rgba(0,0,0,.35)}.input-box input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:12px 3px;font-size:14px}.input-box input::placeholder{color:#687792}.round{width:40px;height:40px;border-radius:12px;border:0;background:#17233b;color:#aebbd3;cursor:pointer}.round:hover{background:#22304e;color:#fff}.send{background:linear-gradient(135deg,#6373ff,#8a60f1);color:#fff;font-weight:800}.send:hover{filter:brightness(1.08)}.hint{text-align:center;color:#58657d;font-size:10px;margin-top:8px}
.light-mode{--bg:#f4f7fb;--panel:#fff;--panel2:#fff;--line:#dce3ef;--text:#111827;--muted:#667085;--ai:#f1f5fb;--user:#5366e9}.light-mode{background:var(--bg);color:var(--text)}.light-mode .sidebar,.light-mode .topbar{background:rgba(255,255,255,.82)}.light-mode .input-box{background:rgba(255,255,255,.96)}.light-mode .input-box input{color:#111827}.light-mode .icon-btn{color:#526078}.light-mode .ai{color:#172033}.light-mode .suggestions button{background:#fff;color:#536078}.light-mode .quick button{color:#526078}
@media(max-width:820px){body{overflow:hidden}.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:absolute;z-index:20;left:0;top:0;bottom:0;width:270px;box-shadow:20px 0 60px rgba(0,0,0,.45)}.mobile-menu{display:block}.topbar{padding:0 12px;height:64px}.top-title h1{font-size:15px}.tools{margin-left:4px}.tools .optional{display:none}.status{font-size:0}.status-dot{margin-left:auto}.chat{width:calc(100% - 24px);padding:24px 0 135px}.welcome{padding:22px 8px 30px}.welcome h2{font-size:25px}.suggestions{grid-template-columns:1fr}.msg{max-width:88%;font-size:13.5px}.composer-area{padding:12px 10px 14px}.hint{display:none}}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar" class="sidebar">
  <div class="logo"><div class="logo-icon">🤖</div><div><strong>G ONE AI</strong><small>Powered by Gemini</small></div></div>
  <button class="newchat" onclick="clearConversation();showWelcome()">＋ New conversation</button>
  <div class="side-title">Quick prompts</div>
  <div class="quick">
    <button onclick="usePrompt('Explain this topic in simple Hindi')">📚 Study help</button>
    <button onclick="usePrompt('Write clean HTML, CSS and JavaScript code for me')">💻 Coding</button>
    <button onclick="usePrompt('Give me a practical daily motivation')">🚀 Motivation</button>
    <button onclick="usePrompt('Tell me a funny joke in Hindi')">😂 Joke</button>
  </div>
  <div class="side-footer">G ONE AI • Gemini API<br>Keep your API key private.</div>
</aside>
<section class="main">
<header class="topbar">
  <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>
  <div class="top-title"><h1>G ONE AI</h1><span class="badge">GEMINI</span></div>
  <div id="status" class="status"><span class="status-dot"></span><span id="statusText">Connecting...</span></div>
  <div class="tools">
    <button class="icon-btn" onclick="toggleTheme()" title="Theme">◐</button>
    <button class="icon-btn optional" onclick="stopSpeaking()" title="Stop voice">■</button>
    <button class="icon-btn optional" onclick="exportChat()" title="Export chat">⇩</button>
    <button class="icon-btn" onclick="clearConversation();showWelcome()" title="Clear chat">⌫</button>
    <button class="icon-btn optional" onclick="openGOneFilePicker()" title="Attach file">＋</button>
    <button class="icon-btn optional" onclick="openGOneImagePicker()" title="Attach image">▧</button>
  </div>
</header>
<div class="chat-wrap" id="chatWrap"><section id="chat" class="chat"></section></div>
<div class="composer-area"><form class="composer" onsubmit="event.preventDefault();sendMessage()"><div class="input-box"><button class="round" type="button" onclick="openGOneFilePicker()" title="Attach">＋</button><input id="userInput" autocomplete="off" placeholder="Message G ONE AI…"><button class="round" type="button" onclick="startVoice()" title="Voice">🎙</button><button class="round send" type="submit" title="Send">➤</button></div><div class="hint">G ONE AI can make mistakes. Check important information.</div></form></div>
</section>
</div>
<script>
function addMessage(text,type){const c=document.getElementById('chat');const row=document.createElement('div');row.className='msg-row '+(type==='user'?'user-row':'');const av=document.createElement('div');av.className='avatar';av.textContent=type==='user'?'👤':'🤖';const d=document.createElement('div');d.className='msg '+(type==='user'?'user':'ai');d.textContent=text;row.appendChild(av);row.appendChild(d);c.appendChild(row);requestAnimationFrame(()=>{const w=document.getElementById('chatWrap');w.scrollTop=w.scrollHeight});}
function showWelcome(){const c=document.getElementById('chat');c.innerHTML='';const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="welcome-icon">🤖</div><h2>How can I help you today?</h2><p>Ask anything in Hindi, Hinglish or English.</p><div class="suggestions"><button onclick="usePrompt(\'Explain AI in simple Hindi\')">✨ Explain AI in simple Hindi</button><button onclick="usePrompt(\'Create a modern HTML website for me\')">💻 Create a website</button><button onclick="usePrompt(\'Make a study plan for today\')">📚 Make a study plan</button><button onclick="usePrompt(\'Tell me a short funny joke\')">😂 Tell me a joke</button></div>';c.appendChild(w)}
function usePrompt(t){document.getElementById('userInput').value=t;document.getElementById('userInput').focus();sendMessage()}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
async function checkGeminiStatus(){try{const r=await fetch('/api/status');const d=await r.json();const s=document.getElementById('statusText'),dot=document.querySelector('.status-dot');if(d.apiConfigured){s.textContent='Gemini API Connected';dot.style.background='#39d98a'}else{s.textContent='API Key Missing';dot.style.background='#ffb020'}}catch(e){document.getElementById('statusText').textContent='Server Offline';document.querySelector('.status-dot').style.background='#ff4d6d'}}
window.addEventListener('DOMContentLoaded',()=>{showWelcome();checkGeminiStatus()});
</script>
<script src="g-one-ai-part4.js"></script>
<script src="g-one-ai-part6.js"></script>
<script src="g-one-ai-parts7-10.js"></script>
<script>
const gOneOriginalSendMessage=window.sendMessage;window.sendMessage=async function(){const input=document.getElementById('userInput');const text=(input?.value||'').trim();if(!text)return;const searchCommand=/^(?:search|web search|google|latest|find)\s+(.+)/i.test(text);if(searchCommand){addMessage(text,'user');input.value='';try{const answer=await askPart6(text);addMessage(answer||'Search command not recognized.','ai');if(typeof speak==='function')speak(answer||'Search complete.')}catch(err){addMessage('Web search unavailable. Gemini chat is still available.','ai')}return}return gOneOriginalSendMessage()};
</script>
</body>
</html>
