services:
  - type: web
    name: g-one-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: G_ONE_AI_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
